[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py2md"
version = "0.1.4"
authors = [
  { name="Xero64", email="xero64@gmail.com" },
]
description = "Run Python code in Jupyter to generate markdown reports."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "MIT" }
license-files = ["LICEN[CS]E*"]
dependencies = [
    "jupyter-client>=8.6.3",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.4",
]

[project.urls]
Homepage = "https://github.com/Xero64/py2md"
Issues = "https://github.com/Xero64/py2md/issues"

[project.scripts]
py2md = "py2md.__main__:main"
